name: Jobhunt process accepted

# Every hour: for each posting accepted in the web app, generate the tailored
# CV and cover letter, create the Drive folder and add the tracker row.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 * * * *"

permissions:
  contents: read

concurrency:
  group: jobhunt-process
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: jobhunt
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      DRIVE_ROOT_FOLDER_ID: ${{ vars.DRIVE_ROOT_FOLDER_ID }}
      TRACKER_SHEET_ID: ${{ vars.TRACKER_SHEET_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobhunt/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python -m pipeline.process
