name: Polycool Strategy Live Trader (norm1e69)

# Corre en un runner propio (VPS en Finlandia, no bloqueada por Polymarket
# para ordenes reales - GitHub Actions hosteado si lo esta). Sin el limite
# de 6h de los runners de GitHub, asi que corre dias seguidos en vez de
# reiniciar cada 6h.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 0 * * *"  # re-trigger diario, solo como red de seguridad

permissions:
  contents: write

concurrency:
  group: polycool-strategy-live-trader
  cancel-in-progress: false

jobs:
  live_trade:
    runs-on: [self-hosted, norm1e69]
    timeout-minutes: 10080  # 7 dias
    env:
      # LIVE solo queda en "1" si el secret LIVE_TRADING_ENABLED existe y
      # vale "1" - por defecto (secret sin crear) corre en dry-run, sin
      # riesgo, aunque el workflow se dispare solo.
      LIVE: ${{ secrets.LIVE_TRADING_ENABLED }}
      POLY_PRIVATE_KEY: ${{ secrets.POLY_PRIVATE_KEY }}
      POLY_FUNDER: ${{ vars.POLY_FUNDER }}
      POLY_SIGNATURE_TYPE: ${{ vars.POLY_SIGNATURE_TYPE }}
      LIVE_MAX_TOTAL_CAPITAL: ${{ vars.LIVE_MAX_TOTAL_CAPITAL }}
      FIXED_TRADE_SIZE: ${{ vars.FIXED_TRADE_SIZE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip3 install -q --break-system-packages polymarket-client

      - name: Run live trader + auto-publish for ~7 dias
        run: bash scripts/run_live_bounded.sh 604000
