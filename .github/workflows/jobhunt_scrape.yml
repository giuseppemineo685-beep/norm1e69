name: Jobhunt daily scrape

# Every morning: read the company pages and the alert emails, score the new
# postings and leave them in the web app as "pendientes".

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * * *"   # 05:00 UTC, 07:00 in Zurich in summer

permissions:
  contents: read

concurrency:
  group: jobhunt-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: jobhunt
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
      SCORE_LIMIT: ${{ vars.JOBHUNT_SCORE_LIMIT || 60 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jobhunt/requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python -m pipeline.scrape
