name: Jobhunt tests

on:
  push:
    paths: ["jobhunt/**", ".github/workflows/jobhunt_*.yml"]
  pull_request:
    paths: ["jobhunt/**"]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jobhunt/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
